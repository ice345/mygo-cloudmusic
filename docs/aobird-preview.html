<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>青鸟 · 示例</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0d;
    --paper: #f3f0e8;
    --glass: #9aab9c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    overflow: hidden;
    font-family: "Hiragino Sans", "PingFang SC", "Noto Sans SC", sans-serif;
    color: white;
  }
  .wash {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 36% 28% at 50% 46%, rgba(78, 148, 150, 0.22), transparent 72%),
      radial-gradient(ellipse 78% 62% at 50% 50%, rgba(78, 96, 90, 0.30), transparent 70%),
      var(--bg);
    transition: background 700ms ease;
  }
  body.liuguang .wash {
    background:
      radial-gradient(ellipse 60% 50% at 50% 48%, rgba(196, 122, 86, 0.22), transparent 64%),
      var(--bg);
  }
  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .block { position: relative; text-align: center; width: min(920px, 86vw); }
  .line {
    display: flex; justify-content: center; flex-wrap: nowrap;
    font-family: "Hiragino Mincho ProN", "Songti SC", "Noto Serif SC", serif;
    font-weight: 400;
    font-size: clamp(40px, 6vw, 72px);
    letter-spacing: 0.12em;
    line-height: 1.15;
    color: var(--paper);
  }
  body.liuguang .line {
    font-family: "Hiragino Sans", "PingFang SC", sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
    font-size: clamp(44px, 6.4vw, 80px);
  }
  .ch {
    display: inline-block;
    will-change: transform, opacity, filter;
  }
  .answer {
    margin-top: 28px;
    margin-left: 14%;
    font-family: "Hiragino Mincho ProN", "Songti SC", "Noto Serif SC", serif;
    font-weight: 300;
    font-size: clamp(16px, 2vw, 22px);
    letter-spacing: 0.18em;
    color: rgba(243, 240, 232, 0.55);
    text-align: left;
  }
  body.liuguang .answer {
    margin-left: 0;
    margin-top: 18px;
    text-align: center;
    font-family: "Hiragino Sans", "PingFang SC", sans-serif;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.62);
  }
  .rest {
    position: fixed; left: 50%; top: 46%;
    height: 1px; width: 0;
    background: rgba(176, 206, 204, 0.5);
    transform: translateX(-50%);
  }
  body.liuguang .rest { background: transparent; }
  .dots {
    position: fixed; left: 50%; top: 46%;
    display: flex; gap: 14px; transform: translate(-50%, -50%);
    opacity: 0;
  }
  .dots i {
    width: 7px; height: 7px; border-radius: 99px;
    background: rgba(255, 236, 220, 0.85);
    display: block;
  }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; padding: 0 24px 28px;
  }
  .note { font-size: 12px; letter-spacing: 0.04em; color: rgba(255,255,255,0.38); min-height: 1.2em; }
  .pills { display: flex; gap: 8px; }
  button {
    appearance: none; border: 0; cursor: pointer;
    height: 32px; padding: 0 14px; border-radius: 999px;
    background: transparent; color: rgba(255,255,255,0.55);
    font: 600 13px/1 "Hiragino Sans", "PingFang SC", sans-serif;
  }
  button:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
  button.on { background: rgba(255,255,255,0.14); color: white; }
  .mark {
    position: fixed; top: 22px; left: 24px;
    font-size: 12px; letter-spacing: 0.14em; color: rgba(255,255,255,0.32);
  }
  body.shot .bar, body.shot .mark { display: none; }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="mark">示例 · 不是应用里的画面</div>
  <div class="stage">
    <div class="block">
      <div class="line" id="line"></div>
      <div class="answer" id="answer"></div>
      <div class="rest" id="rest"></div>
      <div class="dots" id="dots"><i></i><i></i><i></i></div>
    </div>
  </div>
  <div class="bar">
    <div class="note" id="note"></div>
    <div class="pills">
      <button type="button" id="bird" class="on">青鸟</button>
      <button type="button" id="light">流光</button>
    </div>
  </div>
<script>
const LINES = [
  { text: "風が廊下を渡る", tr: "风穿过走廊", t0: 0.7 },
  { text: "遠くで息をする", tr: "远处有人呼吸", t0: 12.0 },
];
const LOOP = 20;
const params = new URLSearchParams(location.search);
let style = params.get("style") === "light" ? "light" : "bird";
let frozen = params.has("t") ? Number(params.get("t")) : null;
if (params.has("shot")) document.body.classList.add("shot");

const lineEl = document.getElementById("line");
const answerEl = document.getElementById("answer");
const restEl = document.getElementById("rest");
const dotsEl = document.getElementById("dots");
const noteEl = document.getElementById("note");
const birdBtn = document.getElementById("bird");
const lightBtn = document.getElementById("light");

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function ease(u) { return 1 - Math.pow(1 - clamp(u, 0, 1), 3); }
function spring(t) {
  const w = 9.2, z = 0.38;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * Math.cos(wd * t);
}

let built = "";
function ensure(text) {
  if (built === text) return;
  built = text;
  lineEl.replaceChildren(...[...text].map((ch) => {
    const s = document.createElement("span");
    s.className = "ch";
    s.textContent = ch;
    return s;
  }));
}

function applyStyle() {
  document.body.classList.toggle("liuguang", style === "light");
  birdBtn.classList.toggle("on", style === "bird");
  lightBtn.classList.toggle("on", style === "light");
  noteEl.textContent = style === "bird"
    ? "整句从玻璃另一侧的雾里凝出来。翻译晚一步，偏在旁边。间奏是一条短线。"
    : "对照：字从旁边弹入、放大、带一点光。这是现在的流光，不是青鸟。";
}

function phraseAt(time) {
  let phrase = null;
  for (const line of LINES) {
    if (time >= line.t0 && time < line.t0 + 7.2) phrase = line;
  }
  return phrase;
}

function frame(now) {
  const time = frozen == null ? (now / 1000) % LOOP : frozen;
  const phrase = phraseAt(time);
  const bird = style === "bird";

  if (!phrase) {
    ensure("");
    answerEl.textContent = "";
    answerEl.style.opacity = 0;
    const u = clamp((time - 8.0) / 0.8, 0, 1);
    const fade = time > 11.2 ? clamp(1 - (time - 11.2) / 0.4, 0, 1) : 1;
    if (bird) {
      restEl.style.width = (ease(u) * 32) + "vw";
      restEl.style.opacity = String(0.7 * fade);
      dotsEl.style.opacity = 0;
    } else {
      restEl.style.width = "0";
      const breath = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(time * 3.2));
      dotsEl.style.opacity = String(fade);
      [...dotsEl.children].forEach((dot, i) => {
        const w = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(time * 3.2 + i * 0.7));
        dot.style.opacity = String(w * fade);
        dot.style.transform = "scale(" + (0.8 + 0.4 * w) + ")";
      });
    }
    request();
    return;
  }

  restEl.style.width = "0";
  restEl.style.opacity = 0;
  dotsEl.style.opacity = 0;
  ensure(phrase.text);
  const chars = [...lineEl.children];
  const local = time - phrase.t0;
  const leave = clamp((local - 6.2) / 0.7, 0, 1);

  const mist = clamp(local / 1.8, 0, 1);
  const lineIn = mist * mist * (3 - 2 * mist);
  chars.forEach((el, i) => {
    const start = 0.15 + i * 0.38;
    if (bird) {
      el.style.opacity = String(lineIn * (1 - leave));
      el.style.filter = "blur(" + ((1 - lineIn) * 9) + "px)";
      el.style.transform = "translateY(" + ((1 - lineIn) * 3) + "px)";
      el.style.textShadow = "none";
      el.style.color = "#f3f0e8";
    } else {
      const since = local - start;
      let scale = 0.5, opacity = 0, blur = 10, x = 28, rot = 8;
      if (since > 0) {
        const s = spring(Math.min(since, 1.4));
        const settle = clamp(since / 0.55, 0, 1);
        scale = 0.5 + (1.28 - 0.5) * s;
        if (since > 0.45) scale = 1.28 + (1 - 1.28) * ease((since - 0.45) / 0.5);
        opacity = clamp(since / 0.12, 0, 1);
        blur = 10 * (1 - clamp(since / 0.22, 0, 1));
        x = 28 * (1 - settle);
        rot = 8 * (1 - settle);
      }
      el.style.opacity = String(opacity * (1 - leave));
      el.style.filter = "blur(" + blur + "px)";
      el.style.transform = "translateX(" + x + "px) rotate(" + rot + "deg) scale(" + scale + ")";
      const glow = clamp(since / 0.25, 0, 1) * (1 - clamp((since - 0.7) / 0.6, 0, 1));
      el.style.textShadow = glow > 0.02 ? "0 0 18px rgba(232, 168, 122, " + (0.85 * glow) + ")" : "none";
      el.style.color = "rgba(255,255,255," + (0.55 + 0.45 * clamp(since / 0.4, 0, 1)) + ")";
    }
  });

  const trStart = 1.05;
  const te = ease((local - trStart) / 0.9);
  answerEl.textContent = phrase.tr;
  if (bird) {
    const drift = (1 - te) * 36;
    answerEl.style.opacity = String(te * 0.92 * (1 - leave));
    answerEl.style.transform = "translateX(" + drift + "px)";
    answerEl.style.filter = "blur(" + ((1 - te) * 1.5) + "px)";
  } else {
    answerEl.style.opacity = String(clamp((local - 0.2) / 0.25, 0, 1) * (1 - leave));
    answerEl.style.transform = "none";
    answerEl.style.filter = "none";
  }
  request();
}

let raf = 0;
function request() {
  if (frozen != null) return;
  raf = requestAnimationFrame(frame);
}

birdBtn.onclick = () => { style = "bird"; built = ""; applyStyle(); };
lightBtn.onclick = () => { style = "light"; built = ""; applyStyle(); };
addEventListener("keydown", (e) => {
  if (e.key !== " ") return;
  e.preventDefault();
  if (frozen == null) frozen = (performance.now() / 1000) % LOOP;
  else { const t = frozen; frozen = null; frame(performance.now() - t * 1000); }
});

applyStyle();
if (style === "light") built = "";
frame(frozen == null ? performance.now() : frozen * 1000);
</script>
</body>
</html>
