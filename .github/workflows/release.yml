# Pushing a tag such as v0.2.0 builds the apps of macOS, Windows and
# Linux, signs them and their updates, and uploads them to a draft
# release of the tag, which is published by hand: installed apps update
# to it then.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  # The same checks as every push: a tag on a commit that fails them
  # builds nothing.
  test:
    uses: ./.github/workflows/test.yml

  draft-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mygo build signs the updates with this key, and refuses one that
      # is not updates.publicKey's: without it every build would fail
      # after the draft is made. The key is an Ed25519 private key, its
      # public half in its last 32 bytes. See CONTRIBUTING.md, Releases.
      - name: Check the update signing key
        env:
          KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The MYGO_UPDATER_PRIVATE_KEY secret is missing: add it under Settings, Secrets and variables, Actions (CONTRIBUTING.md, Releases)."
            exit 1
          fi
          public=$(printf '%s' "$KEY" | base64 -d | tail -c 32 | base64)
          if [ "$public" != "$(jq -r .updates.publicKey mygo.json)" ]; then
            echo "::error::MYGO_UPDATER_PRIVATE_KEY is not the key of updates.publicKey in mygo.json: installed apps would refuse its updates."
            exit 1
          fi
      # mygo build uploads to the release of mygo.json's version, whichever
      # tag started the workflow.
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      # mygo build puts the version's section of CHANGELOG.md in the update
      # manifests, which the update window shows; the release page gets the
      # same notes, in place of GitHub's from the pull requests.
      - name: Take the notes from the changelog
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload
      # MyGo's Linux build publishes a .deb. Arch gets a package of the same
      # files, uploaded to the draft this job already created.
      - name: Arch Linux packages
        if: matrix.name == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y zstd
          shopt -s nullglob
          for stage in build/linux-*; do
            go run ./scripts/archpkg "$stage"
          done
          pkgs=(build/*.pkg.tar.zst)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "no Arch Linux package was built" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${pkgs[@]}"
